<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diagram Lab</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#f4f5fa;--panel:#fff;--ink:#24223a;--muted:#5f5d74;--dim:#9a99ad;--line:rgba(36,34,58,.09);--line2:rgba(36,34,58,.16);
    --accent:#5b4dff;--cyan:#0891b2;--red:#e11d48;--sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  header.top{max-width:1280px;margin:0 auto;padding:52px 24px 16px}
  .eyebrow{font:600 12px var(--mono);color:var(--muted)}
  h1{margin:10px 0 8px;font:700 clamp(34px,4.6vw,54px)/1 var(--sans);letter-spacing:-.045em}
  .lede{margin:0;max-width:760px;color:var(--muted);font-size:16.5px}
  nav.chips{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;max-width:1280px;margin:0 auto;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav.chips a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line2);background:#fff;font:500 13px var(--sans);text-decoration:none;color:var(--muted)}
  nav.chips a:hover{color:var(--ink);border-color:var(--ink)}
  nav.chips a b{font:700 11px var(--mono);color:var(--dim)}
  nav.chips a.fav{border-color:var(--accent);color:var(--accent)}
  nav.chips .picks{margin-left:auto;align-self:center;font:600 12px var(--mono);color:var(--muted)}
  main{max-width:1280px;margin:0 auto;padding:20px 24px 90px;display:flex;flex-direction:column;gap:30px}
  .card{background:#fff;border:1.5px solid var(--line2);border-radius:22px;padding:16px;scroll-margin-top:70px;box-shadow:0 18px 40px -32px rgba(36,34,58,.35)}
  .card-h{display:flex;gap:14px;align-items:flex-start;padding:4px 6px 14px}
  .num{font:700 12px var(--mono);color:var(--accent);padding-top:6px}
  .card-h h2{margin:0;font:700 23px/1.2 var(--sans);letter-spacing:-.03em}
  .card-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .grow{flex:1}
  .heart{flex:none;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;font-size:18px;color:var(--dim);cursor:pointer}
  .heart.on{border-color:var(--accent);color:var(--accent);background:#f1efff}

  /* stage */
  .stage{position:relative;height:640px;border-radius:16px;overflow:hidden;border:1.5px solid var(--line2);background:#f8f9fd}
  .stage svg{position:absolute;inset:0;width:100%;height:100%}
  .stats{position:absolute;left:14px;top:14px;z-index:4;display:flex;gap:8px;flex-wrap:wrap;max-width:70%}
  .stat{min-width:104px;padding:7px 12px 8px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;box-shadow:0 3px 0 rgba(36,34,58,.12)}
  .stat i{display:block;font:600 10px var(--mono);font-style:normal;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .stat b{display:block;font:700 15px var(--mono);margin-top:1px;transition:color .3s}
  .stat.hot{border-color:var(--accent)}.stat.hot b{color:var(--accent)}
  .ctl{position:absolute;right:14px;top:14px;z-index:4;display:flex;gap:6px}
  .ctl button{height:34px;min-width:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;font:600 13px var(--sans);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(36,34,58,.12)}
  .ctl button:active{transform:translateY(2px);box-shadow:none}
  .ctl button.on{background:var(--ink);color:#fff}
  .cap{position:absolute;left:14px;right:14px;bottom:14px;z-index:4;display:flex;gap:14px;align-items:center;padding:10px 14px;border:1.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 rgba(36,34,58,.12)}
  .cap .n{flex:none;font:700 12px var(--mono);color:#fff;background:var(--accent);border-radius:8px;padding:3px 8px}
  .cap .t{font:500 14px var(--sans)}
  .cap .dots{margin-left:auto;display:flex;gap:5px;flex:none}
  .cap .dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;cursor:pointer}
  .cap .dots i.on{background:var(--accent);border-color:var(--accent)}

  /* svg */
  .ink{stroke:var(--ink);stroke-linejoin:round;stroke-linecap:round}
  .lbl{font:700 15px var(--sans);fill:var(--ink);letter-spacing:-.01em}
  .sub{font:600 11px var(--mono);fill:#4d4b66}
  .pill-bg{fill:#fff;stroke:var(--ink);stroke-width:2.6}
  .pill text{font:700 13.5px var(--mono);fill:var(--ink)}
  .pill.accent .pill-bg{fill:var(--accent);stroke:var(--ink)}.pill.accent text{fill:#fff}
  .pill.warn .pill-bg{fill:#ffe4ea;stroke:var(--red)}.pill.warn text{fill:#be123c}
  .pill.ok .pill-bg{fill:#e3f8ef;stroke:#0f9d6b}.pill.ok text{fill:#0b7a53}
  .pill.ghost .pill-bg{fill:#f1efff;stroke:var(--accent);stroke-dasharray:5 4}.pill.ghost text{fill:var(--accent)}
  .pill .ic{fill:#fff;stroke:var(--ink);stroke-width:2}
  .pill.accent .ic{fill:var(--accent);stroke:#fff}
  .glyph{fill:none;stroke:var(--ink);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .arr .line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;opacity:.22;transition:opacity .35s,stroke .35s}
  .arr.dash .line{stroke-dasharray:3 9}
  .arr.on .line{opacity:1}
  .arr.on.k-accent .line{stroke:var(--accent)}.arr.on.k-cyan .line{stroke:var(--cyan)}.arr.on.k-red .line{stroke:var(--red)}
  .arr-l{opacity:0;transition:opacity .35s}.arr-l.on{opacity:1}
  .pk{opacity:0}
  .ring{fill:rgba(91,77,255,.07);stroke:var(--accent);stroke-width:3;stroke-dasharray:10 7;opacity:0;transition:opacity .35s}
  .ring.on{opacity:1;animation:march 1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-34}}
  .node{transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
  .node.up{transform:translateY(-10px)}
  .bob{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="eyebrow">Agent Explorer · diagram lab</div>
  <h1>Ten illustrated diagrams</h1>
  <p class="lede">Isometric, hand-built, one per topic. Each one plays its story step by step: use ◀ ▶ or tap the dots, pause any time, and ♥ the ones you want in the lessons.</p>
</header>
<nav class="chips" id="nav"></nav>
<main id="main"></main>

<script>
/* ============================================================
   Iso toolkit
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";
const S = (tag, a = {}, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const H = (tag, cls, p, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (p) p.appendChild(e); return e; };
const C30 = Math.cos(Math.PI / 6);
const P = (x, y, z = 0) => [(x - y) * C30, (x + y) * 0.5 - z];          // world -> screen
const WI = (sx, sy) => [sy + sx / (2 * C30), sy - sx / (2 * C30)];        // screen (floor) -> world
const ps = (pts) => pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
const pt = (p) => p[0].toFixed(1) + "," + p[1].toFixed(1);
const INK = "#24223a", ACC = "#5b4dff";
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TONE = {
  indigo: ["#f4f2ff", "#d8d2ff", "#b5abf8"], cyan: ["#effbff", "#c7edf7", "#9fd9ea"], mint: ["#f0fbf6", "#cdeee0", "#a3dbc3"],
  peach: ["#fff6ee", "#ffdcc3", "#f5bd96"], rose: ["#fff2f5", "#ffd1dc", "#f2a6b8"], lemon: ["#fffbeb", "#fdedb2", "#f0d676"],
  slate: ["#f7f8fb", "#e0e3ed", "#c3c8d9"], white: ["#ffffff", "#eceef5", "#d9dce8"],
};
const GLYPH = {
  spark: "M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z M19 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z",
  chunk: "M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z",
  chip: "M7 7h10v10H7z M10 10h4v4h-4z M9 3v4 M15 3v4 M9 17v4 M15 17v4 M3 9h4 M3 15h4 M17 9h4 M17 15h4",
  db: "M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3",
  doc: "M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6",
  search: "M10.5 4a6.5 6.5 0 1 1 0 13a6.5 6.5 0 0 1 0-13z M15.5 15.5L21 21",
  calc: "M6 3h12v18H6z M9 7h6 M9 11h1 M14 11h1 M9 15h1 M14 15h1 M9 18h6",
  cal: "M4 6h16v14H4z M4 10h16 M8 3v5 M16 3v5 M8 14h2 M12 14h2",
  mail: "M3 6h18v12H3z M3 7l9 6 9-6",
  shield: "M12 3l8 3v6c0 5-3.5 8-8 9c-4.5-1-8-4-8-9V6z M8.5 12l2.5 2.5 4.5-5",
  mic: "M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z M6 11a6 6 0 0 0 12 0 M12 17v4",
  wave: "M3 12h2 M7 8v8 M11 4v16 M15 8v8 M19 11v2",
  branch: "M12 21v-9 M12 12L5 5 M12 12l7-7 M5 5v5 M5 5h5 M19 5v5 M19 5h-5",
  user: "M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8z M4 21c1-4 4-6 8-6s7 2 8 6",
  globe: "M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18",
  folder: "M3 6h6l2 2h10v11H3z",
  git: "M7 4v10 M7 17a3 3 0 1 0 0.01 0 M17 7a3 3 0 1 0 0.01 0 M17 10c0 4-4 5-10 4",
  plug: "M9 3v5 M15 3v5 M6 8h12v3a6 6 0 0 1-12 0z M12 17v4",
  layers: "M12 3l9 5-9 5-9-5z M3 12.5l9 5 9-5 M3 17l9 5 9-5",
  coins: "M12 4c4 0 7 1.4 7 3s-3 3-7 3-7-1.4-7-3 3-3 7-3z M5 7v5c0 1.6 3 3 7 3s7-1.4 7-3V7 M5 12v5c0 1.6 3 3 7 3s7-1.4 7-3v-5",
  bolt: "M13 2L4 14h7l-1 8 9-12h-7z",
  gauge: "M4 16a8 8 0 1 1 16 0 M12 16l4-5",
  x: "M6 6l12 12 M18 6L6 18",
  check: "M5 12l5 5 9-10",
  report: "M6 3h12v18H6z M9 8h6 M9 12h6 M9 16h3",
};

function roundPoly(pts, r) {
  const n = pts.length; let d = "";
  for (let i = 0; i < n; i++) {
    const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
    const l1 = Math.hypot(a[0] - b[0], a[1] - b[1]), l2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const p1 = [b[0] + (a[0] - b[0]) / l1 * rr, b[1] + (a[1] - b[1]) / l1 * rr];
    const p2 = [b[0] + (c[0] - b[0]) / l2 * rr, b[1] + (c[1] - b[1]) / l2 * rr];
    d += (i ? "L" : "M") + pt(p1) + "Q" + pt(b) + " " + pt(p2);
  }
  return d + "Z";
}

function makeCtx(svg, pid) {
  const defs = S("defs", {}, svg);
  let n = 0;
  const ctx = { svg, defs, pid, nodes: {}, arrows: {}, uid: () => `${pid}-u${n++}` };
  for (const [k, t] of Object.entries(TONE)) {
    const g = S("linearGradient", { id: `${pid}-${k}-t`, x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
    S("stop", { offset: 0, "stop-color": "#ffffff" }, g); S("stop", { offset: 1, "stop-color": t[0] }, g);
    const c = S("linearGradient", { id: `${pid}-${k}-c`, x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
    S("stop", { offset: 0, "stop-color": t[1] }, c); S("stop", { offset: 1, "stop-color": t[2] }, c);
  }
  const f = S("filter", { id: `${pid}-sh`, x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs); S("feGaussianBlur", { stdDeviation: 7 }, f);
  const pat = S("pattern", { id: `${pid}-grid`, width: 104, height: 60, patternUnits: "userSpaceOnUse" }, defs);
  S("path", { d: "M0 0L104 60M0 60L104 0", stroke: "rgba(91,77,255,.10)", "stroke-width": 1.2 }, pat);
  for (const [k, c] of [["ink", INK], ["accent", ACC], ["cyan", "#0891b2"], ["red", "#e11d48"]]) {
    const m = S("marker", { id: `${pid}-ah-${k}`, viewBox: "0 0 12 12", refX: 9, refY: 6, markerUnits: "userSpaceOnUse", markerWidth: 18, markerHeight: 18, orient: "auto" }, defs);
    S("path", { d: "M1 1.5L11 6L1 10.5z", fill: c, stroke: c, "stroke-width": 1, "stroke-linejoin": "round" }, m);
  }
  S("rect", { x: -1400, y: -900, width: 2800, height: 1800, fill: `url(#${pid}-grid)` }, svg);
  ctx.floor = S("g", {}, svg); ctx.arrowsL = S("g", {}, svg); ctx.layer = S("g", {}, svg); ctx.top = S("g", {}, svg);
  return ctx;
}

function glyph(p, cx, cy, name, size = 28, cls = "glyph") {
  const k = size / 24;
  return S("path", { d: GLYPH[name] || GLYPH.spark, class: cls, transform: `translate(${cx - size / 2},${cy - size / 2}) scale(${k})` }, p);
}

/* floor shadow under an object footprint (world) */
function shadow(ctx, p, wx, wy, w, d, z = 0) {
  S("path", { d: roundPoly([P(wx - w / 2 + 8, wy - d / 2 + 16, z), P(wx + w / 2 + 16, wy - d / 2 + 8, z), P(wx + w / 2 + 16, wy + d / 2 + 16, z), P(wx - w / 2 + 8, wy + d / 2 + 16, z)], 22), fill: "rgba(36,34,58,.16)", filter: `url(#${ctx.pid}-sh)` }, p);
}

/* rounded slab (plinth), world-based */
function slab(ctx, p, wx, wy, w, d, h, o = {}) {
  const { r = 16, z = 0, top = "#ffffff", side = "#e6e8f1", sw = 2.6 } = o;
  const T0 = P(wx - w / 2, wy - d / 2, z + h), T1 = P(wx + w / 2, wy - d / 2, z + h), T2 = P(wx + w / 2, wy + d / 2, z + h), T3 = P(wx - w / 2, wy + d / 2, z + h);
  const B1 = P(wx + w / 2, wy - d / 2, z), B2 = P(wx + w / 2, wy + d / 2, z), B3 = P(wx - w / 2, wy + d / 2, z);
  S("path", { d: roundPoly([T3, T2, T1, B1, B2, B3], r), fill: side, class: "ink", "stroke-width": sw }, p);
  S("path", { d: roundPoly([T0, T1, T2, T3], r), fill: top, class: "ink", "stroke-width": sw }, p);
  S("line", { x1: T2[0], y1: T2[1] + r * 0.3, x2: B2[0], y2: B2[1] - r * 0.3, class: "ink", "stroke-width": 1.6, opacity: 0.35 }, p);
  return { T0, T1, T2, T3 };
}

/* register a node so steps can focus it and arrows can reach it */
function reg(ctx, key, node, ring) {
  node.key = key; ctx.nodes[key] = node;
  if (ring) {
    const [wx, wy] = WI(node.ax, node.ay), w = ring;
    node.ring = S("path", { d: roundPoly([P(wx - w / 2, wy - w / 2), P(wx + w / 2, wy - w / 2), P(wx + w / 2, wy + w / 2), P(wx - w / 2, wy + w / 2)], 26), class: "ring" }, ctx.floor);
  }
  return node;
}

/* iso cube with label printed on the front, icon on top */
function cube(ctx, key, ax, ay, o = {}) {
  const { s = 92, h = 70, z = 0, tone = "indigo", icon, title, sub, r = 12, parent, ring = true, noShadow } = o;
  const [wx, wy] = WI(ax, ay);
  const g = S("g", { class: "node" }, parent || ctx.layer);
  const p = (dx, dy, dz) => P(wx + dx, wy + dy, z + dz);
  const T0 = p(-s / 2, -s / 2, h), T1 = p(s / 2, -s / 2, h), T2 = p(s / 2, s / 2, h), T3 = p(-s / 2, s / 2, h), B1 = p(s / 2, -s / 2, 0), B2 = p(s / 2, s / 2, 0), B3 = p(-s / 2, s / 2, 0);
  if (!z && !noShadow) shadow(ctx, g, wx, wy, s, s);
  const hex = roundPoly([T0, T1, B1, B2, B3, T3], r), cid = ctx.uid();
  S("path", { d: hex }, S("clipPath", { id: cid }, ctx.defs));
  const fg = S("g", { "clip-path": `url(#${cid})` }, g);
  S("polygon", { points: ps([T3, T2, B2, B3]), fill: TONE[tone][1] }, fg);
  S("polygon", { points: ps([T2, T1, B1, B2]), fill: TONE[tone][2] }, fg);
  S("polygon", { points: ps([T0, T1, T2, T3]), fill: `url(#${ctx.pid}-${tone}-t)` }, fg);
  S("path", { d: `M${pt(T3)}L${pt(T2)}L${pt(T1)}M${pt(T2)}L${pt(B2)}`, fill: "none", class: "ink", "stroke-width": 2, opacity: 0.55 }, g);
  S("path", { d: hex, fill: "none", class: "ink", "stroke-width": 2.8 }, g);
  const top = p(0, 0, h);
  if (icon) glyph(g, top[0], top[1], icon, Math.min(34, s * 0.36));
  if (title) {
    const cy = (T2[1] + B2[1]) / 2 + (sub ? -1 : 6);
    S("text", { x: T2[0], y: cy, "text-anchor": "middle", class: "lbl" }, g).textContent = title;
    if (sub) S("text", { x: T2[0], y: cy + 17, "text-anchor": "middle", class: "sub" }, g).textContent = sub;
  }
  const node = { g, ax, ay, cx: ax, cy: ay - z - h / 2 - s * 0.12, rad: s * 0.92, topY: T0[1], faceL: (u, v) => [B3[0] + u * C30, B3[1] + u * 0.5 - v], faceR: (u, v) => [B2[0] + u * C30, B2[1] - u * 0.5 - v], s, h };
  return key ? reg(ctx, key, node, ring ? s + 54 : 0) : node;
}

/* face-local transforms: draw in (u along the face, v up) */
const faceL = (n) => `matrix(${C30} 0.5 0 -1 ${n.faceL(0, 0)[0]} ${n.faceL(0, 0)[1]})`;

/* cylinder (database / cache) */
function cylinder(ctx, key, ax, ay, o = {}) {
  const { r = 50, h = 76, tone = "indigo", icon = "db", label, labelIcon, side = 1 } = o;
  const g = S("g", { class: "node" }, ctx.layer);
  const [wx, wy] = WI(ax, ay); shadow(ctx, g, wx, wy, r * 2, r * 2);
  const rx = r * 1.2247, ry = r * 0.7071, yT = ay - h;
  const gid = `${ctx.pid}-${tone}-c`;
  S("path", { d: `M${ax - rx},${yT} L${ax - rx},${ay} A${rx},${ry} 0 0 0 ${ax + rx},${ay} L${ax + rx},${yT} Z`, fill: `url(#${gid})`, class: "ink", "stroke-width": 2.8 }, g);
  for (const k of [1 / 3, 2 / 3]) S("path", { d: `M${ax - rx},${yT + h * k} A${rx},${ry} 0 0 0 ${ax + rx},${yT + h * k}`, fill: "none", class: "ink", "stroke-width": 1.8, opacity: 0.45 }, g);
  S("ellipse", { cx: ax, cy: yT, rx, ry, fill: TONE[tone][0], class: "ink", "stroke-width": 2.8 }, g);
  glyph(g, ax, ay - h / 2 + ry * 0.45, icon, 30);
  if (label) pill(ctx, ax + side * (rx + 26), ay - h / 2 - 6, label, { icon: labelIcon, align: side > 0 ? "start" : "end" });
  return reg(ctx, key, { g, ax, ay, cx: ax, cy: ay - h / 2, rad: rx + 8 }, r * 2 + 50);
}

/* laptop on a plinth */
function laptop(ctx, key, ax, ay, o = {}) {
  const { label, labelIcon = "user", screen = "indigo" } = o;
  const g = S("g", { class: "node" }, ctx.layer);
  const [wx, wy] = WI(ax, ay);
  shadow(ctx, g, wx, wy, 170, 130);
  slab(ctx, g, wx, wy, 172, 132, 16, { r: 20 });
  const z0 = 16;

function gauge(ctx, x, y, label, pct, o = {}) {

/* arrow between two nodes, with optional label and travelling packets */
function arrow(ctx, key, A, B, o = {}) {
  const { bend = 0, dash = false, label, lo = -24, kind = "accent", t1 = 0, t2 = 0 } = o;
  const a = ctx.nodes[A] || A, b = ctx.nodes[B] || B;
  const dx = b.cx - a.cx, dy = b.cy - a.cy, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  const x1 = a.cx + ux * (a.rad + t1), y1 = a.cy + uy * (a.rad + t1), x2 = b.cx - ux * (b.rad + t2), y2 = b.cy - uy * (b.rad + t2);
  const mx = (x1 + x2) / 2 - uy * bend, my = (y1 + y2) / 2 + ux * bend;
  const g = S("g", { class: `arr k-${kind}${dash ? " dash" : ""}` }, ctx.arrowsL);
  const path = S("path", { d: `M${x1},${y1} Q${mx},${my} ${x2},${y2}`, class: "line", "marker-end": `url(#${ctx.pid}-ah-${kind === "ink" ? "ink" : kind})` }, g);
  const col = { accent: ACC, cyan: "#06b6d4", red: "#e11d48", ink: ACC }[kind];

}

const whenVisible = (node, onIn, onOut) => new IntersectionObserver((es) => es.forEach((e) => (e.isIntersecting ? onIn() : onOut())), { threshold: 0.12 }).observe(node);

function scene(def) {
  const stage = document.getElementById(def.id);
  const svg = S("svg", { viewBox: def.view || "-590 -335 1180 705", preserveAspectRatio: "xMidYMid meet" }, stage);
  const ctx = makeCtx(svg, def.id);
  def.build(ctx);
  /* auto-fit: measure everything drawn and zoom so it fits between the stats bar and the caption.
     More things = zoom out; fewer = zoom in (capped). Re-fits on resize. */
  const box = (() => {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const g of [ctx.floor, ctx.arrowsL, ctx.layer, ctx.top]) {
      const b = g.getBBox(); if (!b.width && !b.height) continue;
      x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.width); y2 = Math.max(y2, b.y + b.height);
    }
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  })();
  const fit = () => {
    const W = stage.clientWidth, Hh = stage.clientHeight, padX = 28, top = 86, bot = 82;
    const s = Math.min((W - padX * 2) / box.w, (Hh - top - bot) / box.h, def.maxZoom || 1.2);
    const vw = W / s, vh = Hh / s, cx = box.x + box.w / 2, cy = box.y + box.h / 2;
    svg.setAttribute("viewBox", `${cx - vw / 2} ${cy - (top + (Hh - top - bot) / 2) / s} ${vw} ${vh}`);
  };
  fit(); new ResizeObserver(fit).observe(stage);
  const stats = H("div", "stats", stage);
  const keys = Object.keys(def.steps[0].stats || {});
  const statEls = keys.map((k) => { const d = H("div", "stat", stats, `<i>${k}</i><b>—</b>`); return d; });
  const ctl = H("div", "ctl", stage);
  const bPrev = H("button", "", ctl, "◀"), bPlay = H("button", "on", ctl, "❚❚"), bNext = H("button", "", ctl, "▶");
  const cap = H("div", "cap", stage, `<span class="n"></span><span class="t"></span><span class="dots"></span>`);
  const dots = def.steps.map((_, i) => { const d = H("i", "", cap.querySelector(".dots")); d.onclick = () => { go(i); playing = false; bPlay.classList.remove("on"); bPlay.textContent = "▶ Play"; }; return d; });
  let i = 0, t0 = performance.now(), playing = !REDUCE, active = [];
  function go(k) {
    i = (k + def.steps.length) % def.steps.length; t0 = performance.now();
    const st = def.steps[i];
    Object.values(ctx.arrows).forEach((a) => { a.g.classList.remove("on"); a.lab && a.lab.g.classList.remove("on"); a.dots.forEach((d) => d.style.opacity = 0); });
    active = (st.a || []).map((k) => ctx.arrows[k]).filter(Boolean);
    active.forEach((a) => { a.g.classList.add("on"); a.lab && a.lab.g.classList.add("on"); });
    Object.values(ctx.nodes).forEach((n) => { n.ring && n.ring.classList.toggle("on", (st.focus || []).includes(n.key)); n.g.classList.toggle("up", (st.focus || []).includes(n.key)); });
    cap.querySelector(".n").textContent = `${String(i + 1).padStart(2, "0")} / ${String(def.steps.length).padStart(2, "0")}`;
    cap.querySelector(".t").textContent = st.cap;
    dots.forEach((d, j) => d.classList.toggle("on", j === i));
    keys.forEach((k, j) => { const v = (st.stats || {})[k] ?? "—"; const b = statEls[j].querySelector("b"); statEls[j].classList.toggle("hot", b.textContent !== String(v) && v !== "—"); b.textContent = v; });
    def.onStep && def.onStep(ctx, i);
  }
  bPrev.onclick = () => { playing = false; bPlay.classList.remove("on"); bPlay.textContent = "▶ Play"; go(i - 1); };
  bNext.onclick = () => { playing = false; bPlay.classList.remove("on"); bPlay.textContent = "▶ Play"; go(i + 1); };
  bPlay.onclick = () => { playing = !playing; bPlay.classList.toggle("on", playing); bPlay.textContent = playing ? "❚❚" : "▶ Play"; if (playing) t0 = performance.now(); };
  go(0);
  let raf = 0, on = false;
  const tick = (t) => {
    const el = t - t0, dur = def.steps[i].dur || 3200;
    if (playing && el > dur) go(i + 1);
    active.forEach((a, ai) => a.dots.forEach((d, j) => {
      const k = ((el / 1500) + j * 0.5 + ai * 0.12) % 1, p = a.path.getPointAtLength(k * a.len);
      d.setAttribute("cx", p.x); d.setAttribute("cy", p.y); d.style.opacity = k < 0.06 ? k / 0.06 : k > 0.94 ? (1 - k) / 0.06 : 1;
    }));
    def.frame && def.frame(ctx, el, i);
    raf = requestAnimationFrame(tick);
  };
  whenVisible(stage, () => { if (!on) { on = true; raf = requestAnimationFrame(tick); } }, () => { on = false; cancelAnimationFrame(raf); });
}

    c.blocks = S("g", {}, c.layer);
    // front walls (low, glassy)
    S("path", { d: roundPoly([P(wx - L / 2, wy + D / 2), P(wx + L / 2, wy + D / 2), P(wx + L / 2, wy + D / 2, 22), P(wx - L / 2, wy + D / 2, 22)], 6), fill: "rgba(255,255,255,.55)", class: "ink", "stroke-width": 2.6 }, c.layer);
    S("path", { d: roundPoly([P(wx + L / 2, wy - D / 2), P(wx + L / 2, wy + D / 2), P(wx + L / 2, wy + D / 2, 22), P(wx + L / 2, wy - D / 2, 22)], 6), fill: "rgba(255,255,255,.45)", class: "ink", "stroke-width": 2.6 }, c.layer);
    pill(c, -470, 250, "system", { icon: "layers", size: 12 }).g.querySelector(".ic").setAttribute("fill", TONE.slate[2]);
    pill(c, -330, 250, "tools", { icon: "plug", size: 12 }).g.querySelector(".ic").setAttribute("fill", TONE.indigo[2]);
    pill(c, -200, 250, "history", { icon: "doc", size: 12 }).g.querySelector(".ic").setAttribute("fill", TONE.cyan[2]);
    pill(c, -50, 250, "reply space", { icon: "spark", size: 12, kind: "ghost" });
    c.drop = pill(c, -470, -120, "oldest turn dropped", { kind: "warn", icon: "x", size: 12 });
  },
  steps: Array.from({ length: 11 }, (_, k) => {
    const turns = k, used = 800 + 600 + Math.min(turns, 8) * 420;
    return { a: [], focus: [], dur: 2000, cap: k === 0 ? "Every request starts with the system prompt and tool definitions." : turns <= 8 ? `Turn ${turns}: the whole history is re-sent, so the tray fills up.` : `Turn ${turns}: full. The oldest turn falls out to make room.`, stats: { "Turns": String(turns), "History": `${Math.min(turns, 8) * 420} tok`, "Used": `${used.toLocaleString()} tok` } };
  }),
  onStep(c, i) {
    const { L, D, wx, wy } = c.tray; c.blocks.innerHTML = "";
    const cols = 13, s = 34, gap = (L - 30) / cols;
    const hist = Math.min(i, 8), first = Math.max(0, i - 8);
    const colType = (k) => k === 0 ? "slate" : k <= 2 ? "indigo" : k <= 10 ? (k - 3 < hist ? "cyan" : null) : "ghost";
    const cells = [];
    for (let k = 0; k < cols; k++) for (let r = 0; r < 3; r++) cells.push([k, r]);
    cells.sort((a, b) => (a[0] + a[1] * 1.5) - (b[0] + b[1] * 1.5));
    for (const [k, r] of cells) {
      const t = colType(k); if (!t) continue;
      const bx = wx - L / 2 + 22 + k * gap + s / 2, by = wy - D / 2 + 30 + r * 52;
      const sc = P(bx, by);
      if (t === "ghost") { S("path", { d: roundPoly([P(bx - s / 2, by - s / 2, 2), P(bx + s / 2, by - s / 2, 2), P(bx + s / 2, by + s / 2, 2), P(bx - s / 2, by + s / 2, 2)], 6), fill: "rgba(91,77,255,.06)", stroke: ACC, "stroke-width": 2, "stroke-dasharray": "4 4" }, c.blocks); continue; }
      const tone = t === "cyan" && ((k - 3 + first) % 2) ? "mint" : t;
      cube(c, null, sc[0], sc[1], { s, h: 26, tone, r: 6, parent: c.blocks, ring: false, noShadow: true });
    }
    const used = 800 + 600 + hist * 420; c.gw.set(used / 81.92, used > 7000 ? "#e11d48" : ACC);
    c.gw && (c.gw.label = used);
    c.drop.g.style.transition = "opacity .3s"; c.drop.g.style.opacity = i > 8 ? 1 : 0;
  },
});

/* ============================================================
   10 Cost, caching & routing
   ============================================================ */
scene({
  id: "d10",
  build(c) {
    cube(c, "small", 330, -110, { tone: "mint", icon: "bolt", title: "Small model", sub: "cheap · fast", s: 80, h: 58 });
    crowd(c, "users", -440, 70, { label: "10k requests / day" });
    cylinder(c, "cache", -170, 60, { tone: "lemon", icon: "bolt", r: 46, h: 66 });
    c.hit = gauge(c, -170, -110, "cache hits", 0, { color: "#16a34a" });
    cube(c, "router", 70, 70, { tone: "slate", icon: "branch", title: "Router", sub: "easy or hard?", s: 86, h: 62 });
    cube(c, "large", 340, 200, { tone: "indigo", icon: "spark", title: "Large model", sub: "smart · costly", s: 104, h: 80 });
    arrow(c, "r", "users", "cache", { label: "request" });
    arrow(c, "h", "cache", "users", { kind: "cyan", dash: true, label: "cached answer", bend: 70, lo: 30 });
    arrow(c, "m", "cache", "router", { label: "miss" });
    arrow(c, "e", "router", "small", { label: "easy · 80%", bend: -10 });
    arrow(c, "d", "router", "large", { label: "hard · 20%", bend: 10 });
  },
  steps: [
    { a: ["r", "m", "d"], focus: ["large"], cap: "Naive: every request goes to the large model. Illustrative numbers.", stats: { "Cost / month": "$4,500", "Avg latency": "2.4 s", "Cache hits": "0%" } },
    { a: ["r", "h"], focus: ["cache"], cap: "Add a cache: repeated questions are answered without any model.", stats: { "Cost / month": "$2,700", "Avg latency": "1.5 s", "Cache hits": "40%" } },
    { a: ["m"], focus: ["router"], cap: "Misses go to a router that judges how hard the request is.", stats: { "Cost / month": "$2,700", "Avg latency": "1.5 s", "Cache hits": "40%" } },
    { a: ["e"], focus: ["small"], cap: "Easy requests, most of them, go to a small, cheap, fast model.", stats: { "Cost / month": "$900", "Avg latency": "0.8 s", "Cache hits": "40%" } },
    { a: ["d"], focus: ["large"], cap: "Only hard ones reach the large model. Same quality, a fraction of the bill.", stats: { "Cost / month": "$900", "Avg latency": "0.8 s", "Cache hits": "40%" } },
  ],
  onStep(c, i) { c.hit.set(i === 0 ? 0 : 40); },
});
</script>
