<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive, step-by-step lessons on how LLMs, RAG and AI agents work. Simulated, no API keys." />
    <meta name="theme-color" content="#f3f6ff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Agent Explorer — learn LLMs step by step</title>
    <script>
      try {
        var t = localStorage.getItem("ae:theme");
        document.documentElement.dataset.theme = t ? JSON.parse(t) : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
